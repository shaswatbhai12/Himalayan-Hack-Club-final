<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event admin | Himalayan Hack Club</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--red:#ec3750;--bg:#fff;--ink:#1f2d3d;--mute:#5a6b7d;--card:#f3f6f9;--line:#e0e6ed}
@media(prefers-color-scheme:dark){:root{--bg:#17212b;--ink:#f3f6f9;--mute:#a3b1c2;--card:#202d3b;--line:#2f3f52}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}header{border-bottom:2px solid var(--line)}
.nav{height:64px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;text-decoration:none;color:inherit}.logo b,h1 span{color:var(--red)}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:40px 0 8px}h2{margin:32px 0 12px}
.mute{color:var(--mute)}.btn{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:99px;padding:10px 20px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.panel,.event{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;margin:14px 0}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:600}label.full,.form-actions{grid-column:1/-1}input,textarea{width:100%;margin-top:5px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}textarea{min-height:80px;resize:vertical}
.event{display:grid;grid-template-columns:1fr auto;gap:8px}.event h3{margin:0}.event p{margin:4px 0;color:var(--mute)}.event-actions{display:flex;gap:8px;align-items:center}.danger{background:#a51d35}
#status{min-height:1.5em;color:var(--mute)}[hidden]{display:none!important}
@media(max-width:600px){form{grid-template-columns:1fr}.event{grid-template-columns:1fr}.event-actions{justify-content:flex-start}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="logo" href="/">&lt;/&gt; Himalayan <b>Hack Club</b></a><a class="btn ghost" href="/">View site</a></div></header>
<main class="wrap">
<h1>Event <span>admin</span></h1>
<p class="mute">Only accounts ending in @himalayanhackclub.xyz can manage events.</p>
<div id="loginPanel" class="panel" hidden><p>You need a staff account to manage events.</p><button class="btn" id="login" type="button">Lead / staff login</button></div>
<div id="adminPanel" hidden>
<nav class="panel" aria-label="Admin sections"><b>Manage:</b> <a href="#events">Events</a> · <a href="#sponsors">Sponsors</a> · <a href="#team-admin">Team</a></nav>
<div class="panel" id="events"><h2 id="formTitle">Add an event</h2><form id="eventForm">
<label>Title<input id="title" maxlength="120" required></label>
<label>Date<input id="date" type="date" required></label>
<label>Location<input id="location" maxlength="160" value="TBD" required></label>
<label>Tag<input id="tag" maxlength="40" value="Event" required></label>
<label class="full">Description<textarea id="description" maxlength="500"></textarea></label>
<div class="form-actions"><button class="btn" type="submit">Save event</button> <button class="btn ghost" id="cancel" type="button" hidden>Cancel edit</button></div>
</form></div>
<p id="status" role="status"></p><h2>Events</h2><div id="eventList"></div>
<div class="panel"><h2 id="sponsorFormTitle">Add a sponsor</h2><form id="sponsorForm">
<label>Name<input id="sponsorName" maxlength="100" required></label>
<label>Website URL<input id="sponsorUrl" type="url" maxlength="500" required></label>
<label>Logo URL<input id="sponsorLogoUrl" type="url" maxlength="500"></label>
<label>Accent color<input id="sponsorAccent" type="color" value="#ec3750" required></label>
<label>Display order<input id="sponsorSortOrder" type="number" value="0" min="0" step="1" required></label>
<label class="full">Description<input id="sponsorDescription" maxlength="200"></label>
<div class="form-actions"><button class="btn" type="submit">Save sponsor</button> <button class="btn ghost" id="cancelSponsor" type="button" hidden>Cancel edit</button></div>
</form></div>
<h2 id="sponsors">Sponsors</h2><div id="sponsorList"></div>
<div class="panel" id="team-admin"><h2 id="teamFormTitle">Add a team member</h2><form id="teamForm">
<label>Name<input id="teamName" maxlength="100" required></label>
<label>Role<input id="teamRole" maxlength="160" required></label>
<label>Initials<input id="teamInitials" maxlength="3" pattern="[A-Za-z0-9]{1,3}" required></label>
<label>Accent color<input id="teamAccent" type="color" value="#ec3750" required></label>
<label>Display order<input id="teamSortOrder" type="number" value="0" min="0" step="1" required></label>
<div class="form-actions"><button class="btn" type="submit">Save team member</button> <button class="btn ghost" id="cancelTeam" type="button" hidden>Cancel edit</button></div>
</form></div>
<h2>Team members</h2><div id="teamList"></div>
</div>
</main>
<script src="/config.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)}, key=(window.CLUB_CONFIG||{}).CLERK_KEY||"pk_test_Z3JlYXQtbXVzdGFuZy02NTYyLmNsZXJrLmFjY291bnRzLmRldiQ", editing=null, editingSponsor=null;
  function showLogin(){ $("loginPanel").hidden=false; $("adminPanel").hidden=true; }
  function showAdmin(){ $("loginPanel").hidden=true; $("adminPanel").hidden=false; loadEvents(); loadSponsors(); loadTeam(); }
  function loadClerk(){
    if(!key||key.indexOf("PASTE")>-1)return showLogin();
    if(window.Clerk)return window.Clerk.load().then(checkUser);
    var parts=key.split("_"),host;
    try{host=atob(parts[2]).slice(0,-1)}catch(e){return showLogin()}
    var script=document.createElement("script");script.async=true;script.crossOrigin="anonymous";script.setAttribute("data-clerk-publishable-key",key);script.src="https://"+host+"/npm/@clerk/clerk-js@5/dist/clerk.browser.js";
    script.onload=function(){window.Clerk.load().then(checkUser).catch(showLogin)};script.onerror=showLogin;document.head.appendChild(script);
  }
  function checkUser(){window.Clerk.user?showAdmin():showLogin()}
  function token(){return window.Clerk.session?window.Clerk.session.getToken():Promise.reject(new Error("Please sign in again"))}
  function request(url,options){
    return token().then(function(t){options=options||{};options.headers=Object.assign({},options.headers,{"Authorization":"Bearer "+t,"Content-Type":"application/json"});return fetch(url,options)}).then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(e.error||"Request failed")});return r.status===204?null:r.json()});
  }
  function loadEvents(){fetch("/api/events").then(function(r){return r.json()}).then(function(events){var list=$("eventList");list.innerHTML="";events.forEach(function(event){var card=document.createElement("div"),title=document.createElement("h3"),info=document.createElement("p"),actions=document.createElement("div"),edit=document.createElement("button"),del=document.createElement("button");card.className="event";title.textContent=event.title;info.textContent=event.date+" · "+event.location+" · "+event.tag+" — "+event.description;actions.className="event-actions";edit.className="btn ghost";edit.textContent="Edit";edit.onclick=function(){startEdit(event)};del.className="btn danger";del.textContent="Delete";del.onclick=function(){deleteEvent(event.id)};actions.appendChild(edit);actions.appendChild(del);card.appendChild(document.createElement("div")).appendChild(title);card.firstChild.appendChild(info);card.appendChild(actions);list.appendChild(card)})}).catch(function(e){$("status").textContent=e.message})}
  function startEdit(event){editing=event.id;$("formTitle").textContent="Edit an event";$("title").value=event.title;$("date").value=event.date;$("location").value=event.location;$("tag").value=event.tag;$("description").value=event.description;$("cancel").hidden=false;window.scrollTo(0,0)}
  function reset(){editing=null;$("formTitle").textContent="Add an event";$("eventForm").reset();$("location").value="TBD";$("tag").value="Event";$("cancel").hidden=true}
  function deleteEvent(id){if(!confirm("Delete this event?"))return;request("/api/events?id="+id,{method:"DELETE"}).then(function(){$("status").textContent="Event deleted.";loadEvents()}).catch(function(e){$("status").textContent=e.message})}
  $("eventForm").onsubmit=function(e){e.preventDefault();var data={title:$("title").value,date:$("date").value,location:$("location").value,tag:$("tag").value,description:$("description").value};request(editing?"/api/events?id="+editing:"/api/events",{method:editing?"PATCH":"POST",body:JSON.stringify(data)}).then(function(){ $("status").textContent="Event saved.";reset();loadEvents()}).catch(function(e){$("status").textContent=e.message})};
  $("cancel").onclick=reset;$("login").onclick=function(){if(window.Clerk)window.Clerk.openSignIn({afterSignInUrl:location.href});else loadClerk()};loadClerk();
  function loadSponsors(){request("/api/sponsors").then(function(sponsors){var list=$("sponsorList");list.innerHTML="";sponsors.forEach(function(sponsor){var card=document.createElement("div"),title=document.createElement("h3"),info=document.createElement("p"),actions=document.createElement("div"),edit=document.createElement("button"),del=document.createElement("button");card.className="event";title.textContent=sponsor.name;info.textContent=sponsor.url+" — "+sponsor.description;actions.className="event-actions";edit.className="btn ghost";edit.textContent="Edit";edit.onclick=function(){startSponsorEdit(sponsor)};del.className="btn danger";del.textContent="Delete";del.onclick=function(){deleteSponsor(sponsor.id)};actions.appendChild(edit);actions.appendChild(del);card.appendChild(document.createElement("div")).appendChild(title);card.firstChild.appendChild(info);card.appendChild(actions);list.appendChild(card)})}).catch(function(e){$("status").textContent=e.message})}
  function startSponsorEdit(sponsor){editingSponsor=sponsor.id;$("sponsorFormTitle").textContent="Edit a sponsor";$("sponsorName").value=sponsor.name;$("sponsorUrl").value=sponsor.url;$("sponsorLogoUrl").value=sponsor.logoUrl;$("sponsorAccent").value=sponsor.accent;$("sponsorSortOrder").value=sponsor.sortOrder;$("sponsorDescription").value=sponsor.description;$("cancelSponsor").hidden=false;window.scrollTo(0,0)}
  function resetSponsor(){editingSponsor=null;$("sponsorFormTitle").textContent="Add a sponsor";$("sponsorForm").reset();$("sponsorAccent").value="#ec3750";$("sponsorSortOrder").value="0";$("cancelSponsor").hidden=true}
  function deleteSponsor(id){if(!confirm("Delete this sponsor?"))return;request("/api/sponsors?id="+id,{method:"DELETE"}).then(function(){$("status").textContent="Sponsor deleted.";loadSponsors()}).catch(function(e){$("status").textContent=e.message})}
  $("sponsorForm").onsubmit=function(e){e.preventDefault();var data={name:$("sponsorName").value,url:$("sponsorUrl").value,logoUrl:$("sponsorLogoUrl").value,accent:$("sponsorAccent").value,sortOrder:$("sponsorSortOrder").value,description:$("sponsorDescription").value};request(editingSponsor?"/api/sponsors?id="+editingSponsor:"/api/sponsors",{method:editingSponsor?"PATCH":"POST",body:JSON.stringify(data)}).then(function(){$("status").textContent="Sponsor saved.";resetSponsor();loadSponsors()}).catch(function(e){$("status").textContent=e.message})};
  $("cancelSponsor").onclick=resetSponsor;
  function loadTeam(){request("/api/team").then(function(members){var list=$("teamList");list.innerHTML="";members.forEach(function(member){var card=document.createElement("div"),title=document.createElement("h3"),info=document.createElement("p"),actions=document.createElement("div"),edit=document.createElement("button"),del=document.createElement("button");card.className="event";title.textContent=member.name;info.textContent=member.role+" · "+member.initials+" · order "+member.sortOrder;actions.className="event-actions";edit.className="btn ghost";edit.textContent="Edit";edit.onclick=function(){startTeamEdit(member)};del.className="btn danger";del.textContent="Delete";del.onclick=function(){deleteTeam(member.id)};actions.appendChild(edit);actions.appendChild(del);card.appendChild(document.createElement("div")).appendChild(title);card.firstChild.appendChild(info);card.appendChild(actions);list.appendChild(card)})}).catch(function(e){$("status").textContent=e.message})}
  function startTeamEdit(member){editingTeam=member.id;$("teamFormTitle").textContent="Edit a team member";$("teamName").value=member.name;$("teamRole").value=member.role;$("teamInitials").value=member.initials;$("teamAccent").value=member.accent;$("teamSortOrder").value=member.sortOrder;$("cancelTeam").hidden=false;window.scrollTo(0,0)}
  function resetTeam(){editingTeam=null;$("teamFormTitle").textContent="Add a team member";$("teamForm").reset();$("teamAccent").value="#ec3750";$("teamSortOrder").value="0";$("cancelTeam").hidden=true}
  function deleteTeam(id){if(!confirm("Delete this team member?"))return;request("/api/team?id="+id,{method:"DELETE"}).then(function(){$("status").textContent="Team member deleted.";loadTeam()}).catch(function(e){$("status").textContent=e.message})}
  var editingTeam=null;
  $("teamForm").onsubmit=function(e){e.preventDefault();var data={name:$("teamName").value,role:$("teamRole").value,initials:$("teamInitials").value,accent:$("teamAccent").value,sortOrder:$("teamSortOrder").value};request(editingTeam?"/api/team?id="+editingTeam:"/api/team",{method:editingTeam?"PATCH":"POST",body:JSON.stringify(data)}).then(function(){$("status").textContent="Team member saved.";resetTeam();loadTeam()}).catch(function(e){$("status").textContent=e.message})};
  $("cancelTeam").onclick=resetTeam;
})();
</script>
</body>
</html>
